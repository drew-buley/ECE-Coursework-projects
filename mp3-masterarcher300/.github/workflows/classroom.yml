name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: long run in less than 2 seconds
      id: long-run-in-less-than-2-seconds
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: long run in less than 2 seconds
        setup-command: make clean; make
        command: time ./longrun.sh
        timeout: 10
        max-score: 10
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        LONG-RUN-IN-LESS-THAN-2-SECONDS_RESULTS: "${{steps.long-run-in-less-than-2-seconds.outputs.result}}"
      with:
        runners: long-run-in-less-than-2-seconds
